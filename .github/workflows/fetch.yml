name: Fetch Android SDK (add 37)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch platform-37 & build-tools-37
        run: |
          U=https://dl.google.com/android/repository
          fetch() {
            local url=$1 tag=$2 title=$3
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "skip $tag"; return; fi
            F=$(basename "$url")
            curl -sL -o "$F" "$url"
            SZ=$(stat -c%s "$F" 2>/dev/null || echo 0)
            if [ "$SZ" -lt 1000000 ]; then echo "FAIL $url"; rm -f "$F"; return; fi
            gh release create "$tag" "$F" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$title"
            rm -f "$F"
          }
          fetch $U/platform-37.0_r02.zip "platform-37.0" "Platform 37"
          fetch $U/build-tools_r37_linux.zip "build-tools-37" "Build-Tools 37"
        env:
          GH_TOKEN: ${{ github.token }}
